<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Únete a Buzzy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d14;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    .card {
      background: #16161f;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      border-radius: 20px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 32px rgba(124,58,237,0.4);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(90deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .bonus-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.97); opacity: 0.85; }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      color: #fff;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .spinner {
      display: none;
      margin: 20px auto 0;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      display: none;
      margin-top: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🐝</div>
    <h1>Te invitaron a Buzzy</h1>
    <p class="subtitle">Regístrate y recibe 3 USD de bienvenida para enviar regalos a tus creadores favoritos.</p>

    <div class="bonus-badge">
      🎁 +200 tokens de bienvenida
    </div>

    <a id="btn-app" class="btn btn-primary" href="#">
      Abrir en la app
    </a>

    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Intentando abrir la app...</p>
  </div>

  <script>
    const CODE    = "{{ code }}";
    const DEEP    = "buzzy://app/join?code=" + CODE;
    const STORE   = "{{ play_store_url }}";
    const SIGNUP  = "{{ signup_url }}";

    const btnApp    = document.getElementById("btn-app");
    const spinner   = document.getElementById("spinner");
    const statusEl  = document.getElementById("status");

    btnApp.href = DEEP;

    btnApp.addEventListener("click", function (e) {
      e.preventDefault();

      spinner.style.display = "block";
      statusEl.style.display = "block";
      statusEl.textContent   = "Intentando abrir la app...";

      // Intenta abrir la app nativa
      window.location.href = DEEP;

      // Si después de 2.5s el usuario sigue aquí, la app no está instalada
      const timer = setTimeout(function () {
        statusEl.textContent = "App no encontrada. Redirigiendo a Play Store...";
        setTimeout(function () {
          window.location.href = STORE;
        }, 800);
      }, 2500);

      // Si la página se oculta (la app se abrió) cancelamos el timer
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) clearTimeout(timer);
      }, { once: true });
    });
  </script>
</body>
</html>
